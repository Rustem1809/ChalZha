<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Good Night</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
      color: #fff;
    }

    .container {
      text-align: center;
      padding: 40px;
      max-width: 90%;
    }

    .message {
      font-size: clamp(1.8rem, 6vw, 3.5rem);
      font-weight: 700;
      letter-spacing: 2px;
      line-height: 1.3;
      text-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
      animation: fadeIn 1.5s ease-out;
    }

    .sub {
      margin-top: 20px;
      font-size: clamp(1rem, 3vw, 1.4rem);
      opacity: 0.8;
      font-weight: 300;
    }

    .moon {
      font-size: 4rem;
      margin-bottom: 25px;
      animation: float 4s ease-in-out infinite;
    }

    .stars {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: -1;
    }

    .star {
      position: absolute;
      background: white;
      border-radius: 50%;
      animation: twinkle 2s infinite alternate;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-15px); }
    }

    @keyframes twinkle {
      from { opacity: 0.3; }
      to { opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="stars" id="stars"></div>

  <div class="container">
    <div class="moon">🌙</div>
    <div class="message" id="message">Loading...</div>
    <div class="sub" id="sub"></div>
  </div>

  <script>
    // Create stars
    const starsContainer = document.getElementById('stars');
    for (let i = 0; i < 80; i++) {
      const star = document.createElement('div');
      star.className = 'star';
      const size = Math.random() * 3 + 1;
      star.style.width = size + 'px';
      star.style.height = size + 'px';
      star.style.left = Math.random() * 100 + '%';
      star.style.top = Math.random() * 100 + '%';
      star.style.animationDelay = Math.random() * 2 + 's';
      starsContainer.appendChild(star);
    }

    function updateMessage() {
      const now = new Date();
      const hour = now.getHours();   // 0 - 23

      const messageEl = document.getElementById('message');
      const subEl = document.getElementById('sub');

      // Night period: from 00:00 to 05:59
      if (hour >= 0 && hour < 6) {
        messageEl.textContent = "GOOD NIGHT, HAVE A NICE DREAMS";
        subEl.textContent = "Sweet dreams ✨";
      } else {
        messageEl.textContent = "Open it when you go to sleep";
        subEl.textContent = "Come back at night 🌙";
      }
    }

    // Run immediately
    updateMessage();

    // Update every minute
    setInterval(updateMessage, 60000);
  </script>
</body>
</html>
